# ══════════════════════════════════════════════════════════════════════════════
# Pyvot Assignment - Playwright QA Regression
#
# PURPOSE:
#   Runs the assignment-owned Playwright API + UI regression suite in GitHub
#   Actions and uploads the Playwright HTML report as execution evidence.
#
# TRIGGER:
#   - Push to main or pyvot-assignment-feature
#   - Manual execution from GitHub Actions
#
# ENVIRONMENT BEHAVIOUR:
#   - Push-triggered runs use CLEAN by default
#   - Manual runs allow CLEAN or BUGGY to be selected
#   - The SAME Playwright tests and assertions run against both environments
#   - CLEAN/BUGGY URLs are maintained in:
#       scripts/configure-test-environment.ps1
#
# BROWSER:
#   - Uses Playwright's managed Chromium browser
#   - Does NOT require separately installed Google Chrome
#
# NOTES:
#   - Runs sequentially with 1 worker for stable CI execution
#   - Keeps this QA pipeline separate from the original Toolshop workflows
#   - Installs Playwright browser/support binaries and Linux dependencies
#   - Includes FFmpeg required for retained failure videos
# ══════════════════════════════════════════════════════════════════════════════

name: Pyvot QA - Playwright Regression

on:
  push:
    branches:
      - main
      - pyvot-assignment-feature

  # Manual execution allows the tester to choose CLEAN or BUGGY.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'clean'
        type: choice
        options:
          - clean
          - buggy

# Prevent multiple executions of the same branch from running unnecessarily.
concurrency:
  group: pyvot-playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:

  playwright:

    name: Run Pyvot Playwright Tests

    # GitHub-hosted Linux runner.
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ── Checkout repository ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # ── Install exact project dependencies ────────────────────────────────
      #
      # npm ci uses package-lock.json so CI installs the exact dependency
      # versions committed in the repository.
      #
      - name: Install dependencies
        run: npm ci

      # ── Install Playwright browser binaries + Linux dependencies ──────────
      #
      # Installs Playwright-managed browsers including Chromium.
      #
      # It also installs:
      #   - required Linux dependencies
      #   - Playwright support binaries
      #   - FFmpeg used for retained failure videos
      #
      # playwright.config.js does NOT specify:
      #
      #   channel: 'chrome'
      #
      # Therefore Playwright uses its managed Chromium browser.
      #
      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      # ── Configure CLEAN / BUGGY target environment ────────────────────────
      #
      # The URLs are maintained in one reusable PowerShell script:
      #
      #   scripts/configure-test-environment.ps1
      #
      # Manual runs provide:
      #   clean
      #   buggy
      #
      # Push-triggered executions do not have a workflow_dispatch input,
      # therefore CLEAN is selected as the default baseline.
      #
      # The script writes:
      #
      #   TEST_ENVIRONMENT
      #   UI_BASE_URL
      #   API_BASE_URL
      #
      # to GITHUB_ENV so later workflow steps can use them.
      #
      - name: Configure test environment
        shell: pwsh
        run: |
          $targetEnvironment = "${{ github.event.inputs.environment }}"

          # Push-triggered runs do not provide a manual environment input.
          if ([string]::IsNullOrWhiteSpace($targetEnvironment)) {
            $targetEnvironment = "clean"
          }

          ./scripts/configure-test-environment.ps1 `
            -Environment $targetEnvironment

      # ── Display selected environment ──────────────────────────────────────
      #
      # Makes the selected execution environment visible in the CI logs.
      #
      - name: Display selected environment
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Pyvot Playwright Regression"
          Write-Host "=========================================="
          Write-Host "Environment : $env:TEST_ENVIRONMENT"
          Write-Host "UI Base URL : $env:UI_BASE_URL"
          Write-Host "API Base URL: $env:API_BASE_URL"
          Write-Host "Browser     : Playwright Chromium"
          Write-Host "Runner      : GitHub Hosted - Ubuntu"
          Write-Host "=========================================="

      # ── Run API + UI Playwright regression suite ──────────────────────────
      #
      # package.json:
      #
      #   npm test
      #
      # which executes:
      #
      #   playwright test --config=playwright.config.js --workers=1
      #
      # The SAME suite and assertions are executed against CLEAN and BUGGY.
      #
      # playwright.config.js also provides:
      #
      #   - CI retry = 1
      #   - HTML + line reporters
      #   - screenshot on failure
      #   - video retained on failure
      #   - trace on first retry
      #
      - name: Run Playwright regression suite
        run: npm test

      # ── Upload Playwright HTML report ─────────────────────────────────────
      #
      # The report is uploaded even when tests fail.
      #
      # Artifact example:
      #
      #   pyvot-CLEAN-playwright-report-123456789
      #
      # or:
      #
      #   pyvot-BUGGY-playwright-report-123456789
      #
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyvot-${{ env.TEST_ENVIRONMENT }}-playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      # ── Upload Playwright raw test evidence ───────────────────────────────
      #
      # Includes available failure artifacts such as:
      #
      #   - screenshots
      #   - traces
      #   - videos
      #
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyvot-${{ env.TEST_ENVIRONMENT }}-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30